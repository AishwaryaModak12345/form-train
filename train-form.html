    <body>
        <h1>Train Ticket Booking</h1>
    
        <form action="/submit_booking" method="POST">
            <!-- Select Train -->
            <label for="train">Select Train:</label>
            <select id="train" name="train" required>
                <option value="train1">Train 1 - Express</option>
                <option value="train2">Train 2 - Superfast</option>
                <option value="train3">Train 3 - Local</option>
                <option value="train4">Train 4 - Deluxe</option>
            </select>
            <br><br>
    
            <!-- Departure Date -->
            <label for="departure_date">Departure Date:</label>
            <input type="date" id="departure_date" name="departure_date" required>
            <br><br>
    
            <!-- Number of People -->
            <label for="num_people">Number of People:</label>
            <input type="number" id="num_people" name="num_people" min="1" max="10" required>
            <br><br>
    
            <!-- Coach Type -->
            <label for="coach_type">Select Coach Type:</label>
            <select id="coach_type" name="coach_type" required>
                <option value="sleeper">Sleeper</option>
                <option value="2AC">2AC</option>
                <option value="3AC">3AC</option>
                <option value="1AC">1AC</option>
            </select>
            <br><br>
    
            <!-- Passenger Information -->
            <h3>Passenger Details</h3>
            <label for="name1">Passenger 1 Name:</label>
            <input type="text" id="name1" name="name1" required>
